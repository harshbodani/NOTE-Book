<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paperly — Your thinking, beautifully saved.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">p</span><span>paperly</span></div>
      <button class="drive-card" id="driveButton" aria-label="Connect Google Drive"><span class="drive-icon">✦</span><span class="drive-copy"><b id="driveLabel">Connect your Drive</b><small id="driveDetail">Keep every idea in sync</small></span><span class="chevron">›</span></button>
      <nav class="main-nav" aria-label="Main navigation"><button class="nav-item active"><span>⌂</span> My notes <em>12</em></button><button class="nav-item"><span>☆</span> Favourites</button><button class="nav-item"><span>◷</span> Recently opened</button></nav>
      <div class="library-head"><span>NOTEBOOKS</span><button id="addNotebook" title="New notebook">＋</button></div><div class="notebook-list" id="notebookList"></div>
      <div class="sidebar-bottom"><button class="nav-item"><span>⚙</span> Preferences</button><div class="user"><div class="avatar">AM</div><div><b>Alex Morgan</b><small>Free workspace</small></div><button>···</button></div></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><div class="crumbs"><button>Personal</button><i>/</i><button id="notebookName">Studio Notes</button><i>/</i><strong id="pageCrumb">01 — Visual directions</strong></div><div class="top-actions"><span class="sync-state" id="syncState"><i></i> Saved to this device</span><button class="icon-button" title="Share">↗</button><button class="more-button">•••</button></div></header>
      <section class="canvas-header"><div><p class="eyebrow">MONDAY, OCTOBER 7</p><h1 id="pageTitle" contenteditable="true">Visual directions <span>✦</span></h1></div><div class="page-actions"><button id="pagesButton">▱ <span id="pageCount">3 pages</span></button><button id="newPageButton">＋ New page</button></div></section>
      <section class="paper-stage" id="paperStage"><div class="paper-shadow"></div><canvas id="drawingCanvas" aria-label="Handwriting canvas"></canvas><div class="paper-content" id="paperContent"><div class="hand-note lavender" style="left:9%;top:15%;transform:rotate(-2deg)">A space to think<br>without friction.</div><div class="hand-note charcoal" style="left:16%;top:36%;transform:rotate(-3deg)">Calm tools.<br>Big ideas.</div><div class="hand-note blue" style="left:61%;top:16%;transform:rotate(3deg)">start here →</div><div class="dot-grid" style="left:47%;top:44%"></div><div class="mood-card" style="left:58%;top:50%;transform:rotate(-2deg)"><div class="sun">☼</div><b>make room<br>for wonder.</b></div></div><button class="add-block" id="addBlock" title="Add text block">＋</button></section>
    </main>
    <aside class="tool-rail" aria-label="Drawing tools"><button class="tool active" data-tool="pen" title="Pen"><span class="pen-glyph">╱</span></button><button class="tool" data-tool="highlighter" title="Highlighter">╲</button><button class="tool" data-tool="eraser" title="Eraser">⌫</button><div class="tool-separator"></div><button class="tool" data-tool="select" title="Select">⌁</button><button class="tool" data-tool="line" title="Line">╱</button><button class="tool" data-tool="shape" title="Shape recognition">□</button><div class="tool-separator"></div><button class="colour-tool" id="colourButton" title="Ink colour"><span id="activeColour"></span></button><div class="colour-popover" id="colourPopover"><div class="wheel" id="colourWheel"><div class="wheel-dot" id="wheelDot"></div></div><label>INK COLOUR <output id="colourCode">#34323C</output></label><div class="shade-row" id="shadeRow"></div></div><button class="tool size-tool" id="sizeButton" title="Stroke size"><span></span></button><input id="sizeRange" class="size-popover" type="range" min="1" max="18" value="4" aria-label="Stroke size"></aside>
  </div><div class="toast" id="toast">New page created</div><script src="app.js"></script>
</body></html>
